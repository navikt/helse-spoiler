apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spoiler
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: isalive
    initialDelay: 10
  readiness:
    path: isready
    initialDelay: 10
  replicas:
    min: 1
    max: 1
  prometheus:
    path: /metrics
  resources:
    requests:
      memory: 256Mi
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: spurtedu
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spoiler-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
